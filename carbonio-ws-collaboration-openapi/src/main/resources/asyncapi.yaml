openapi: 3.0.3
info:
  title: Events Data Models
  version: 2.0.0
  description: |
    Data models for room and meeting events.
    This specification contains only the schemas for code generation purposes.
  x-supported-versions: [ "2.0.0" ]

paths: {}

components:
  schemas:
    # Enums
    EventType:
      type: string
      enum:
        # Room Events
        - RoomCreated
        - RoomUpdated
        - RoomDeleted
        - RoomOwnerPromoted
        - RoomOwnerDemoted
        - RoomPictureChanged
        - RoomPictureDeleted
        - RoomMemberAdded
        - RoomMemberRemoved
        - RoomMuted
        - RoomUnmuted
        - RoomHistoryCleared
        # Meeting Events
        - MeetingCreated
        - MeetingDeleted
        - MeetingParticipantJoined
        - MeetingParticipantLeft
        - MeetingAudioStreamChanged
        - MeetingAudioAnswered
        - MeetingMediaStreamChanged
        - MeetingSdpOffered
        - MeetingSdpAnswered
        - MeetingStarted
        - MeetingStopped
        - MeetingParticipantTalking
        - MeetingParticipantClashed
        - MeetingWaitingParticipantJoined
        - MeetingWaitingParticipantClashed
        - MeetingWaitingParticipantAccepted
        - MeetingWaitingParticipantRejected
        - MeetingParticipantSubscribed
        - MeetingRecordingStarted
        - MeetingRecordingStopped
        - MeetingParticipantHandRaised
        - MeetingParticipantHandRaisedList
        - MeetingDeclined
        - MeetingParticipantUplinkStatusChanged
        # Websocket connection Events
        - WebsocketConnected
        - MessageBrokerDisconnected
        - MessageBrokerRestored
        - Ping
        - Pong
      description: Type of event being published

    MediaType:
      type: string
      enum: [AUDIO, VIDEO, SCREEN]

    MeetingParticipantLeftReason:
      type: string
      enum: [ LEFT, KICKED ]
      description: LEFT when the participant left the meeting, KICKED when a moderator removed them

    # Base Event Schema
    DomainEvent:
      discriminator:
        propertyName: type
        mapping:
          roomCreated: "#/components/schemas/RoomCreated"
          roomUpdated: "#/components/schemas/RoomUpdated"
          roomDeleted: "#/components/schemas/RoomDeleted"
          roomOwnerPromoted: "#/components/schemas/RoomOwnerPromoted"
          roomOwnerDemoted: "#/components/schemas/RoomOwnerDemoted"
          roomPictureChanged: "#/components/schemas/RoomPictureChanged"
          roomPictureDeleted: "#/components/schemas/RoomPictureDeleted"
          roomMemberAdded: "#/components/schemas/RoomMemberAdded"
          roomMemberRemoved: "#/components/schemas/RoomMemberRemoved"
          roomMuted: "#/components/schemas/RoomMuted"
          roomUnmuted: "#/components/schemas/RoomUnmuted"
          roomHistoryCleared: "#/components/schemas/RoomHistoryCleared"
          meetingCreated: "#/components/schemas/MeetingCreated"
          meetingDeleted: "#/components/schemas/MeetingDeleted"
          meetingParticipantJoined: "#/components/schemas/MeetingParticipantJoined"
          meetingParticipantLeft: "#/components/schemas/MeetingParticipantLeft"
          meetingAudioStreamChanged: "#/components/schemas/MeetingAudioStreamChanged"
          meetingAudioAnswered: "#/components/schemas/MeetingAudioAnswered"
          meetingMediaStreamChanged: "#/components/schemas/MeetingMediaStreamChanged"
          meetingSdpOffered: "#/components/schemas/MeetingSdpOffered"
          meetingSdpAnswered: "#/components/schemas/MeetingSdpAnswered"
          meetingStarted: "#/components/schemas/MeetingStarted"
          meetingStopped: "#/components/schemas/MeetingStopped"
          meetingParticipantTalking: "#/components/schemas/MeetingParticipantTalking"
          meetingParticipantClashed: "#/components/schemas/MeetingParticipantClashed"
          meetingWaitingParticipantJoined: "#/components/schemas/MeetingWaitingParticipantJoined"
          meetingWaitingParticipantClashed: "#/components/schemas/MeetingWaitingParticipantClashed"
          meetingWaitingParticipantAccepted: "#/components/schemas/MeetingWaitingParticipantAccepted"
          meetingWaitingParticipantRejected: "#/components/schemas/MeetingWaitingParticipantRejected"
          meetingParticipantSubscribed: "#/components/schemas/MeetingParticipantSubscribed"
          meetingRecordingStarted: "#/components/schemas/MeetingRecordingStarted"
          meetingRecordingStopped: "#/components/schemas/MeetingRecordingStopped"
          meetingParticipantHandRaised: "#/components/schemas/MeetingParticipantHandRaised"
          meetingParticipantHandRaisedList: "#/components/schemas/MeetingParticipantHandRaisedList"
          meetingDeclined: "#/components/schemas/MeetingDeclined"
          meetingParticipantUplinkStatusChanged: "#/components/schemas/MeetingParticipantUplinkStatusChanged"
          websocketConnected: "#/components/schemas/WebsocketConnected"
          messageBrokerDisconnected: "#/components/schemas/MessageBrokerDisconnected"
          messageBrokerRestored: "#/components/schemas/MessageBrokerRestored"
          ping: "#/components/schemas/Ping"
          pong: "#/components/schemas/Pong"
      type: object
      properties:
        type:
          $ref: "#/components/schemas/EventType"
        sentDate:
          type: string
          format: date-time
          description: Timestamp when the event was sent (ISO 8601 format with offset)
          example: "2025-07-09T10:30:00.000Z"
      required:
        - type
        - sentDate

    # Room Events
    RoomCreated:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            roomId:
              type: string
              format: uuid
              description: Unique identifier of the created room
          required:
            - roomId

    RoomUpdated:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            roomId:
              type: string
              format: uuid
            name:
              type: string
            description:
              type: string
            updatedBy:
              type: string
              format: uuid
            nameSystemEventId:
              type: string
              description: "id of the ROOM_NAME_CHANGED system event (timeline item) created by this action, present only when the name changed"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            nameSystemEventCreatedAt:
              type: string
              format: date-time
              description: "createdAt of the nameSystemEventId system event: the timeline item's createdAt and the itemCreatedAt a read marker on it gets; present exactly when nameSystemEventId is"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            descriptionSystemEventId:
              type: string
              description: "id of the ROOM_DESCRIPTION_CHANGED system event (timeline item) created by this action, present only when the description changed"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            descriptionSystemEventCreatedAt:
              type: string
              format: date-time
              description: "createdAt of the descriptionSystemEventId system event: the timeline item's createdAt and the itemCreatedAt a read marker on it gets; present exactly when descriptionSystemEventId is"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          required:
            - roomId
            - name
            - description
            - updatedBy

    RoomDeleted:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            roomId:
              type: string
              format: uuid
          required:
            - roomId

    RoomOwnerPromoted:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            roomId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
          required:
            - roomId
            - userId

    RoomOwnerDemoted:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            roomId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
          required:
            - roomId
            - userId

    RoomPictureChanged:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            roomId:
              type: string
              format: uuid
            updatedAt:
              type: string
              format: date-time
            updatedBy:
              type: string
              format: uuid
            systemEventId:
              type: string
              description: "id of the system event (timeline item) created by this action, if any"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            systemEventCreatedAt:
              type: string
              format: date-time
              description: "createdAt of the systemEventId system event: the timeline item's createdAt and the itemCreatedAt a read marker on it gets; present exactly when systemEventId is"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          required:
            - roomId
            - updatedAt
            - updatedBy

    RoomPictureDeleted:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            roomId:
              type: string
              format: uuid
            deletedBy:
              type: string
              format: uuid
            systemEventId:
              type: string
              description: "id of the system event (timeline item) created by this action, if any"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            systemEventCreatedAt:
              type: string
              format: date-time
              description: "createdAt of the systemEventId system event: the timeline item's createdAt and the itemCreatedAt a read marker on it gets; present exactly when systemEventId is"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          required:
            - roomId
            - deletedBy

    RoomMemberAdded:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            roomId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            isOwner:
              type: boolean
            addedBy:
              type: string
              format: uuid
            systemEventId:
              type: string
              description: "id of the system event (timeline item) created by this action, if any"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            systemEventCreatedAt:
              type: string
              format: date-time
              description: "createdAt of the systemEventId system event: the timeline item's createdAt and the itemCreatedAt a read marker on it gets; present exactly when systemEventId is"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          required:
            - roomId
            - userId
            - isOwner
            - addedBy

    RoomMemberRemoved:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            roomId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            removedBy:
              type: string
              format: uuid
              description: "user who removed the member (the member itself on leave; the first room owner when the removal is automatic, i.e. temporary room clean-up)"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            systemEventId:
              type: string
              description: "id of the system event (timeline item) created by this action, if any"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            systemEventCreatedAt:
              type: string
              format: date-time
              description: "createdAt of the systemEventId system event: the timeline item's createdAt and the itemCreatedAt a read marker on it gets; present exactly when systemEventId is"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          required:
            - roomId
            - userId

    RoomMuted:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            roomId:
              type: string
              format: uuid
          required:
            - roomId

    RoomUnmuted:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            roomId:
              type: string
              format: uuid
          required:
            - roomId

    RoomHistoryCleared:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            roomId:
              type: string
              format: uuid
            clearedAt:
              type: string
              format: date-time
            clearedBy:
              type: string
              format: uuid
              description: "user who cleared the history for everyone; present only for TEMPORARY rooms, absent for the per-user clear"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            systemEventId:
              type: string
              description: "id of the ROOM_HISTORY_CLEARED system event (timeline item) created by this action; present only for TEMPORARY rooms"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            systemEventCreatedAt:
              type: string
              format: date-time
              description: "createdAt of the systemEventId system event: the timeline item's createdAt and the itemCreatedAt a read marker on it gets; present exactly when systemEventId is"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          required:
            - roomId
            - clearedAt

    # Meeting Events
    MeetingCreated:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            roomId:
              type: string
              format: uuid
          required:
            - meetingId
            - roomId

    MeetingDeleted:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
          required:
            - meetingId

    MeetingParticipantJoined:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
              description: UUID of the meeting
            userId:
              type: string
              format: uuid
              description: UUID of the user who joined
          required:
            - meetingId
            - userId

    MeetingParticipantLeft:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            reason:
              $ref: "#/components/schemas/MeetingParticipantLeftReason"
          required:
            - meetingId
            - userId
            - reason

    MeetingAudioStreamChanged:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            moderatorId:
              type: string
              format: uuid
              nullable: true
            active:
              type: boolean
          required:
            - meetingId
            - userId
            - active

    MeetingAudioAnswered:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            sdp:
              type: string
              description: SDP answer string
          required:
            - meetingId
            - userId
            - sdp

    MeetingMediaStreamChanged:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            mediaType:
              $ref: "#/components/schemas/MediaType"
            active:
              type: boolean
          required:
            - meetingId
            - userId
            - mediaType
            - active

    MeetingSdpOffered:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            mediaType:
              $ref: "#/components/schemas/MediaType"
            sdp:
              type: string
              description: SDP offer string
          required:
            - meetingId
            - userId
            - mediaType
            - sdp

    MeetingSdpAnswered:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            mediaType:
              $ref: "#/components/schemas/MediaType"
            sdp:
              type: string
              description: SDP answer string
          required:
            - meetingId
            - userId
            - mediaType
            - sdp

    MeetingStarted:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            starterUser:
              type: string
              format: uuid
            startedAt:
              type: string
              format: date-time
            systemEventId:
              type: string
              description: "id of the system event (timeline item) created by this action, if any"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            systemEventCreatedAt:
              type: string
              format: date-time
              description: "createdAt of the systemEventId system event: the timeline item's createdAt and the itemCreatedAt a read marker on it gets; present exactly when systemEventId is"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          required:
            - meetingId
            - starterUser
            - startedAt

    MeetingStopped:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            endedBy:
              type: string
              format: uuid
            systemEventId:
              type: string
              description: "id of the system event (timeline item) created by this action, if any"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            systemEventCreatedAt:
              type: string
              format: date-time
              description: "createdAt of the systemEventId system event: the timeline item's createdAt and the itemCreatedAt a read marker on it gets; present exactly when systemEventId is"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          required:
            - meetingId
            - endedBy

    MeetingParticipantTalking:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            isTalking:
              type: boolean
          required:
            - meetingId
            - userId
            - isTalking

    MeetingParticipantClashed:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
          required:
            - meetingId

    MeetingWaitingParticipantJoined:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
          required:
            - meetingId
            - userId

    MeetingWaitingParticipantClashed:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
          required:
            - meetingId

    MeetingWaitingParticipantAccepted:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
          required:
            - meetingId
            - userId

    MeetingWaitingParticipantRejected:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
          required:
            - meetingId
            - userId

    MeetingParticipantSubscribed:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            streams:
              type: array
              items:
                $ref: "#/components/schemas/SubscribedStream"
          required:
            - meetingId
            - userId
            - streams

    SubscribedStream:
      type: object
      properties:
        type:
          type: string
        userId:
          type: string
          format: uuid
        mid:
          type: string
      required:
        - type
        - userId
        - mid

    MeetingRecordingStarted:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
          required:
            - meetingId
            - userId

    MeetingRecordingStopped:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
          required:
            - meetingId
            - userId

    MeetingParticipantHandRaised:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            moderatorId:
              type: string
              format: uuid
              nullable: true
            raised:
              type: boolean
              description: Whether hand is raised or lowered
            handRaisedAt:
              type: string
              format: date-time
              nullable: true
          required:
            - meetingId
            - userId
            - raised

    MeetingParticipantHandRaisedList:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            participants:
              type: array
              items:
                type: string
                format: uuid
          required:
            - meetingId
            - participants

    MeetingDeclined:
      allOf:
        - $ref: '#/components/schemas/DomainEvent'
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            systemEventId:
              type: string
              description: "id of the system event (timeline item) created by this action, if any"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            systemEventCreatedAt:
              type: string
              format: date-time
              description: "createdAt of the systemEventId system event: the timeline item's createdAt and the itemCreatedAt a read marker on it gets; present exactly when systemEventId is"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          required:
            - meetingId
            - userId

    # Websocket Events

    MeetingParticipantUplinkStatusChanged:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            meetingId:
              type: string
              format: uuid
            userId:
              type: string
              format: uuid
            networkScore:
              type: number
              nullable: true
              description: tier-weighted network score, 0-10, or null when LOST
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            changedAt:
              type: integer
              format: int64
              description: client wall-clock (epoch ms) when this level was committed; latest wins per user
            maxUplinkTier:
              type: integer
              minimum: 0
              maximum: 2
              nullable: true
              description: publisher webcam GCC tier (0=LOW, 1=MEDIUM, 2=HIGH); absent when not applicable
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            maxHardwareTier:
              type: integer
              minimum: 0
              maximum: 2
              nullable: true
              description: top rung the camera can physically produce (0=LOW, 1=MEDIUM, 2=HIGH); absent when not applicable
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"

          required:
            - meetingId
            - userId
            - changedAt

    # Websocket Events
    WebsocketConnected:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object
          properties:
            queueId:
              type: string
              format: uuid
          required:
            - queueId

    MessageBrokerDisconnected:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object

    MessageBrokerRestored:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object

    Ping:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object

    Pong:
      allOf:
        - $ref: "#/components/schemas/DomainEvent"
        - type: object

    # Chat WsEvent hierarchy (separate from DomainEvent — serialized server→client)
    WsEvent:
      discriminator:
        propertyName: type
        mapping:
          MessageReceived: "#/components/schemas/MessageReceived"
          MessageForwarded: "#/components/schemas/MessageForwarded"
          MessageEdited: "#/components/schemas/MessageEdited"
          MessageDeleted: "#/components/schemas/MessageDeleted"
          MessagePinned: "#/components/schemas/MessagePinned"
          MessageUnpinned: "#/components/schemas/MessageUnpinned"
          ReactionChanged: "#/components/schemas/ReactionChanged"
          ReadUpdated: "#/components/schemas/ReadUpdated"
          PresenceChanged: "#/components/schemas/PresenceChanged"
          Typing: "#/components/schemas/Typing"
          Error: "#/components/schemas/WsError"
          Pong: "#/components/schemas/WsPong"
      type: object
      properties:
        type:
          type: string
        sentDate:
          type: string
          format: date-time
      required:
        - type
        - sentDate

    MessageReceived:
      allOf:
        - $ref: "#/components/schemas/WsEvent"
        - type: object
          properties:
            type:
              type: string
              default: "MessageReceived"
            message:
              $ref: "#/components/schemas/TimelineMessage"
            tempId:
              type: string
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          required:
            - message

    MessageForwarded:
      allOf:
        - $ref: "#/components/schemas/WsEvent"
        - type: object
          properties:
            type:
              type: string
              default: "MessageForwarded"
            message:
              $ref: "#/components/schemas/TimelineMessage"
          required:
            - message

    MessageEdited:
      allOf:
        - $ref: "#/components/schemas/WsEvent"
        - type: object
          properties:
            type:
              type: string
              default: "MessageEdited"
            messageId:
              type: string
            roomId:
              type: string
            text:
              type: string
            editedAt:
              type: string
              format: date-time
          required:
            - messageId
            - roomId
            - text
            - editedAt

    MessageDeleted:
      allOf:
        - $ref: "#/components/schemas/WsEvent"
        - type: object
          properties:
            type:
              type: string
              default: "MessageDeleted"
            messageId:
              type: string
            roomId:
              type: string
            deletedBy:
              type: string
            deletedAt:
              type: string
              format: date-time
          required:
            - messageId
            - roomId
            - deletedBy
            - deletedAt

    MessagePinned:
      allOf:
        - $ref: "#/components/schemas/WsEvent"
        - type: object
          properties:
            type:
              type: string
              default: "MessagePinned"
            messageId:
              type: string
            roomId:
              type: string
            pinnedBy:
              type: string
            timestamp:
              type: string
              format: date-time
            message:
              $ref: "#/components/schemas/TimelineMessage"
              description: "the pinned message, same shape as a timeline message; a reply carries replyToId/repliedMessage only when the original is visible to the recipient"
            systemEventId:
              type: string
              description: "id of the system event (timeline item) created by this action, if any"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            systemEventCreatedAt:
              type: string
              format: date-time
              description: "createdAt of the systemEventId system event: the timeline item's createdAt and the itemCreatedAt a read marker on it gets; present exactly when systemEventId is"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          required:
            - messageId
            - roomId
            - pinnedBy
            - timestamp
            - message

    MessageUnpinned:
      allOf:
        - $ref: "#/components/schemas/WsEvent"
        - type: object
          properties:
            type:
              type: string
              default: "MessageUnpinned"
            messageId:
              type: string
            roomId:
              type: string
            unpinnedBy:
              type: string
            timestamp:
              type: string
              format: date-time
            systemEventId:
              type: string
              description: "id of the system event (timeline item) created by this action, if any"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
            systemEventCreatedAt:
              type: string
              format: date-time
              description: "createdAt of the systemEventId system event: the timeline item's createdAt and the itemCreatedAt a read marker on it gets; present exactly when systemEventId is"
              x-extra-annotation: "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)"
          required:
            - messageId
            - roomId
            - unpinnedBy
            - timestamp

    ReactionChanged:
      allOf:
        - $ref: "#/components/schemas/WsEvent"
        - type: object
          properties:
            type:
              type: string
              default: "ReactionChanged"
            messageId:
              type: string
            roomId:
              type: string
            userId:
              type: string
            reaction:
              type: string
            operation:
              type: string
          required:
            - messageId
            - roomId
            - userId
            - reaction
            - operation

    ReadUpdated:
      allOf:
        - $ref: "#/components/schemas/WsEvent"
        - type: object
          description: "sent only when PUT /rooms/{roomId}/read moves the marker forward; a same or older item sends nothing"
          properties:
            type:
              type: string
              default: "ReadUpdated"
            roomId:
              type: string
            userId:
              type: string
            itemCreatedAt:
              type: string
              format: date-time
              description: creation time of the last timeline item read by the user
          required:
            - roomId
            - userId
            - itemCreatedAt

    PresenceChanged:
      allOf:
        - $ref: "#/components/schemas/WsEvent"
        - type: object
          properties:
            type:
              type: string
              default: "PresenceChanged"
            userId:
              type: string
            online:
              type: boolean
            lastActivity:
              type: string
              format: date-time
              description: |
                Last time the user went offline, also on online events (same value as
                POST /presence/batch). Absent only if the user has never been offline.
          required:
            - userId
            - online

    Typing:
      allOf:
        - $ref: "#/components/schemas/WsEvent"
        - type: object
          properties:
            type:
              type: string
              default: "Typing"
            roomId:
              type: string
            userId:
              type: string
            status:
              type: string
            timestamp:
              type: string
              format: date-time
          required:
            - roomId
            - userId
            - status
            - timestamp

    WsError:
      allOf:
        - $ref: "#/components/schemas/WsEvent"
        - type: object
          properties:
            type:
              type: string
              default: "Error"
            message:
              type: string
            requestId:
              type: string
            code:
              type: string
          required:
            - message

    WsPong:
      allOf:
        - $ref: "#/components/schemas/WsEvent"
        - type: object
          properties:
            type:
              type: string
              default: "Pong"
