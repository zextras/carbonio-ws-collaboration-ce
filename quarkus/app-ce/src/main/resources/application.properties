quarkus.application.name=carbonio-ws-collaboration
%prod.quarkus.http.host=127.78.0.4
%prod.quarkus.http.port=10000
%prod.ws.consul.enabled=true
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://127.78.0.4:20003/carbonio-ws-collaboration-db
# /health, /health/live, /health/ready are served by the CE HealthApi (as in the Guice build)

# B1: keep the deployment-time parts so dropped-in plugins can be re-augmented
quarkus.package.jar.type=mutable-jar
quarkus.package.jar.user-providers-directory=plugins
