# Above core's library defaults (100), below application.properties (250).
config_ordinal=200
%test.quarkus.datasource.devservices.image-name=postgres:16
%test.ws.videoserver.api-secret=test-secret
%test.ws.videoserver.server-id=vs-1
%test.ws.rabbitmq.username=guest
%test.ws.rabbitmq.password=guest
%test.ws.discovery.available-services=carbonio-turn-server-auth
# CE AppConfig keys (MicroProfileAppConfig: ws.config.<CONFIG_NAME>) normally coming from Consul
%test.ws.config.EVENT_DISPATCHER_USER_USERNAME=guest
%test.ws.config.EVENT_DISPATCHER_USER_PASSWORD=guest
%test.ws.config.XMPP_SERVER_USERNAME=test
%test.ws.config.XMPP_SERVER_PASSWORD=test
%test.ws.config.VIDEO_SERVER_TOKEN=test-secret
# no DB name: the V1_4_2 backfill sees no message-dispatcher DB and skips
%test.ws.config.MESSAGE_DISPATCHER_DATABASE_HOST=localhost
%test.ws.config.MESSAGE_DISPATCHER_DATABASE_PORT=5432
