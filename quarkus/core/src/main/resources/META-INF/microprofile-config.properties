quarkus.datasource.db-kind=postgresql
# core migrations run from CoreStartup (CE Java migration needs injected credentials)
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=db/migration/core
quarkus.flyway.schemas=chats
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.jdbc.timezone=UTC
# Single auth path: ZmAuthMechanism + UserManagementIdentityProvider build the identity (one UM
# call). Not proactive so that UM failures and refusals go through the CE exception mappers: the
# CE AuthenticationFilter (pre-matching) resolves the deferred identity and derives the CE principal.
quarkus.http.auth.proactive=false

ws.consul.enabled=false
ws.consul.url=http://localhost:8500
# EventsWebSocketManager.onOpen talks to RabbitMQ (blocking): run endpoint callbacks on workers.
quarkus.websocket.dispatch-to-worker=true
